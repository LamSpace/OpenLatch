# 进程级故障演练重档位 job（spec: continuous-integration「drill 与 benchmark 重档位 job」）。
# 不入 PR 门禁：共享 runner 抖动不得转化为 PR 假红；仅手动触发（理由见下）。
# concurrency 串行：分区演练占固定端口 9411 与 netns 前缀 oln，并行必冲突误报。
# hosted runner 提供 passwordless sudo（-n 无交互可用），承载 netns/iptables 特权段。
#
# ── nightly 已于 2026-09-14 暂停（tasks 2.4 处置）──
# 两次 nightly（drill #1/#2）均败于 ubuntu-latest 2 vCPU 的算力预算：重载时序断言
# （先主后从滚动、netns 分区选主 40s 窗）在 CPU 饥饿下必然超时，而 netns/bind/看门狗
# 全数零异常——非产品回归、非随机 flake，重试亦无效。项目自身文档即要求数值门
# 「在独占硬件上执行」。恢复自动化的正确形态：self-hosted（开发者机）或 ≥4 vCPU 档
# runner，届时解注释 schedule 并改 runs-on。详见 openspec 台账 ci-first-runs.md。
name: drill

on:
  workflow_dispatch:
  # schedule:            # paused 2026-09-14 — see note above
  #   - cron: "23 19 * * *"

concurrency:
  group: drill
  cancel-in-progress: false

jobs:
  drill:
    name: -Pdrill full process-level suite
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Build reactor + shaded server jar (drill prerequisite)
        run: mvn -B -ntp clean install -DskipTests

      - name: Run drills
        run: mvn -B -ntp verify -Pdrill

      # 防假绿：任一演练套件缺失或被跳过（jar 未产出/特权不满足时的
      # assume-skip 形态）都判红——缺失≠通过。
      - name: Assert every drill suite executed (no silent skip)
        if: '!cancelled()'
        run: |
          set -e
          require() {
            f="$1"
            if [ ! -f "$f" ]; then
              echo "::error::missing failsafe report $f (suite did not run)"
              exit 1
            fi
            if grep -q "Skipped: [1-9]" "$f"; then
              echo "::error::$f reports Skipped>0 (assume-skip = false green)"
              exit 1
            fi
          }
          require openlatch-client/target/failsafe-reports/io.github.lamspace.openlatch.client.LeaderKillDrillIT.txt
          require openlatch-client/target/failsafe-reports/io.github.lamspace.openlatch.client.RollingRestartDrillIT.txt
          require openlatch-client/target/failsafe-reports/io.github.lamspace.openlatch.client.PartitionDrillIT.txt
          require openlatch-server/target/failsafe-reports/io.github.lamspace.openlatch.server.raft.LeaderStallReproDrillIT.txt

      - name: Upload drill reports & node logs (always)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: drill-evidence-${{ github.run_number }}
          path: |
            */target/drill-reports/**
            */target/drill-logs/**
            */target/failsafe-reports/**
          if-no-files-found: warn
          retention-days: 30
