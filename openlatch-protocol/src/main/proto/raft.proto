// OpenLatch Phase 2 服务端内部复制消息（详设 §4.2 / §7.1）。
// 本文件的消息仅在 Raft 副本之间与状态机应用路径使用，客户端不收发：
// MUST NOT 被引用进 Envelope oneof（客户端 wire format 零扰动）。
// 编号纪律：已发布的字段号与枚举值即持久化日志格式的兼容性契约，
// 后续变更 MUST NOT 变更或复用（协议层有冻结测试锁证）。
syntax = "proto3";

package openlatch.raft;

import "openlatch.proto";

option java_package = "io.github.lamspace.openlatch.protocol.raft";
option java_multiple_files = true;
option java_outer_classname = "RaftProto";

// 复制条目类型（详设 §4.2）。编号稳定：0 保留为未知值。
enum RaftEntryType {
  RAFT_ENTRY_UNKNOWN   = 0;
  SESSION_OPEN         = 1;  // 会话登记（接入节点 HELLO 时提交）
  SESSION_CLOSE        = 2;  // 会话关闭（断连传播 / 失联批量清理）
  LOCK_ACQUIRE_ENTRY   = 3;  // 获取锁（仅"经复制授予/排队裁决"语义）
  LOCK_RELEASE_ENTRY   = 4;  // 释放锁
  LEASE_RENEW_ENTRY    = 5;  // 续租
  LEASE_EXPIRE_ENTRY   = 6;  // 到期释放（Leader 扫描驱动，回放按 token 幂等）
  NOOP                 = 7;  // Leader 当选后确认提交位点；亦作失联探针载体
  LATCH_COUNT_DOWN_ENTRY = 8; // v3：屏障倒计数（计数变更进日志，等待队列不入，详设 §2.4）
  ATOMIC_OP_ENTRY        = 9; // v4：原子变量操作（读写皆进日志；GET 应用为零迁移）
  // v5：循环屏障三命令——到场/离场/动作了结皆改变复制侧世代状态
  // （到场账簿、合拢与破障裁决、执行者指定、世代号），一律进日志；
  // 在队位次与通知时序仍是 Leader 本地态，不入日志与快照。
  BARRIER_AWAIT_ENTRY       = 10;
  BARRIER_LEAVE_ENTRY       = 11;
  BARRIER_ACTION_DONE_ENTRY = 12;
  // v7：队列操作——写（put/take/drain）与读（peek/size）皆进日志（读应用为
  // 零迁移，判例 ATOMIC GET）；等待挂起、唤醒推送与已通知时序是 Leader 本地态，
  // 不入日志与快照；应用点不可满足的回执 DENIED 为零迁移判定。
  QUEUE_OP_ENTRY            = 13;
}

// 复制条目外壳（详设 §4.2）。command_payload 为下列 *Payload 之一按 type 的序列化。
message RaftLogEntry {
  RaftEntryType type              = 1;
  int64         seq               = 2;  // Leader 分配的全局序号，用于幂等与诊断
  int64         wall_clock_ms     = 3;  // Leader 发起时刻；apply 期间经条目时刻注入（§4.3）
  bytes         command_payload   = 4;  // 复用 Phase 1 请求消息序列化 + session_id 包装
}

// SESSION_OPEN / SESSION_CLOSE 载荷。session_id 为逻辑会话 id（nodeId<<32|localSeq）。
message SessionPayload {
  int64 session_id = 1;
}

// LOCK_ACQUIRE_ENTRY 载荷。request_id 显式携带（Phase 1 中位于 Envelope，
// 条目无 Envelope 上下文）；queue_if_busy 由 request.wait_ms != 0 导出，
// 条目内不重复存储；应用侧引擎调用恒不登记等待项（design D9/D12）。
message AcquirePayload {
  int64                session_id  = 1;
  int64                request_id  = 2;
  openlatch.AcquireRequest request = 3;
}

// LOCK_RELEASE_ENTRY 载荷。
message ReleasePayload {
  int64                  session_id  = 1;
  openlatch.ReleaseRequest request   = 2;
}

// LEASE_RENEW_ENTRY 载荷。
message RenewPayload {
  int64                      session_id  = 1;
  openlatch.LeaseRenewRequest request    = 2;
}

// LATCH_COUNT_DOWN_ENTRY 载荷（Phase 3 T1）。request 携带 key/count/total；
// 定型创建亦经本条目（count=0 的纯初始化，await 携带 total 由 Leader 折算为
// 本条目先行提交，design D1/D6 精化）。
message LatchCountDownPayload {
  int64                         session_id = 1;
  openlatch.LatchCountDownRequest request  = 2;
}

// ATOMIC_OP_ENTRY 载荷（v4）。request 携带 op/形态/操作数/断言/op_seq；
// 写操作的去重判定在应用侧按条目内状态完成（同槽重放不重复推进版本戳），
// 跨副本回放得出一致应答。
message AtomicOpPayload {
  int64                      session_id  = 1;
  int64                      request_id  = 2;
  openlatch.AtomicOpRequest  request     = 3;
}

// v5：循环屏障命令载荷。到场与了结的幂等判定（(会话,请求) 到场账簿、
// 了结记录、执行者挂账）全在应用侧条目内状态完成，跨副本回放得出一致裁决。
message BarrierAwaitPayload {
  int64                        session_id  = 1;
  int64                        request_id  = 2;  // 原 BARRIER_AWAIT 信封 request_id（等待项身份位）
  openlatch.BarrierAwaitRequest request    = 3;
}

message BarrierLeavePayload {
  int64                        session_id = 1;
  openlatch.BarrierLeaveRequest request   = 2;  // 内含 await_request_id（0=纯破障）
}

message BarrierActionDonePayload {
  int64                              session_id = 1;
  openlatch.BarrierActionDoneRequest request    = 2;
}

// v7：队列命令载荷。request 携带 op/形态/容量断言/元素/延迟/批量上限/op_seq；
// 写操作的去重判定在应用侧按条目内每会话去重槽完成（同槽重放返回原交付回执，
// TAKE/DRAIN 重放交付同一份字节），跨副本回放得出一致应答；延时元素的绝对
// 到期时刻于应用点以条目携带时刻折算（expires_at = wall_clock_ms + delay_ms），
// 任何副本任何物理时刻回放逐毫秒一致。
message QueueOpPayload {
  int64                      session_id  = 1;
  int64                      request_id  = 2;  // 原 QUEUE_OP 信封 request_id（阻塞式回弹重挂的幂等位）
  openlatch.QueueOpRequest   request     = 3;
}

// LEASE_EXPIRE_ENTRY 载荷（§4.3：到期判断只在 Leader，回放侧按 token 幂等校验）。
// wall_clock_ms（条目外壳）携带 Leader 发现到期的时刻，回放以该时刻为"现在"。
message ExpirePayload {
  string key         = 1;
  int64  lease_token = 2;
}

// 状态机应用回执：apply 结果（非复制状态，仅 Leader 用于应答客户端）。
enum ApplyStatus {
  APPLY_STATUS_UNKNOWN = 0;
  OK                   = 1;  // 授予 / 释放 / 续租 / 会话与到期条目成功应用
  QUEUED               = 2;  // 需排队（Leader 在应用点登记本地等待队列，§4.5/D3）
  DENIED               = 3;  // 立即式获取被拒
  NOT_HELD             = 4;
  INVALID_TOKEN        = 5;
  REJECT_SESSION       = 6;  // sessionId 未在复制状态中登记
  QUEUE_FULL           = 7;  // 触发单 key 等待深度限额
  INTERNAL_ERROR       = 8;  // 条目无法解析或应用异常
  INVALID_REQUEST      = 9;  // v3：参数形状非法（家族误用/总量断言不成立），P3-04 码形接正
  BARRIER_BROKEN       = 10; // v5：在带裁决——等待项所属世代已破障（非应用失败）
}

// 应用回执载荷。字段按条目类型择用：
// 授予：lease_token/granted_lease_ms/lease_expires_at_ms；排队：queue_position；
// 释放：fully_released；续租：lease_expires_at_ms；
// 释放/到期/会话关闭（且实际释放了持锁）：freed_keys —— 双写核算给出的
// "本次应用完全空出的 key"，Leader 侧等待队首唤醒的唯一依据（design D9，
// 非复制状态，仅回执携带）。
message ApplyResult {
  ApplyStatus status              = 1;
  int64       lease_token         = 2;
  int64       granted_lease_ms    = 3;
  int64       lease_expires_at_ms = 4;
  int32       queue_position      = 5;
  bool        fully_released      = 6;
  repeated string freed_keys      = 7;
  int64       latch_remaining     = 8;  // v3：LATCH_COUNT_DOWN_ENTRY OK 时的剩余计数
  // v4：ATOMIC_OP_ENTRY 应答四元组（status=OK 时有效；同槽重放时即重放此组）。
  bool        atomic_applied      = 9;  // CAS 家族是否落值（非 CAS 写恒 true；GET 恒 false）
  sint64      atomic_old_value    = 10; // 操作前值
  sint64      atomic_value        = 11; // 操作后（或当前）值
  int64       atomic_version      = 12; // 操作后版本戳（GET/失败不推）
  // v5：BARRIER_*_ENTRY 回执（status=OK/QUEUED/BARRIER_BROKEN 时择用；
  // queue_position 复用既有 5 号位）。generation 为等待项所属/被裁决的世代号。
  int64       barrier_generation  = 13; // 本回执针对的世代号
  bool        barrier_executor    = 14; // true=本到场被指定为动作执行者（挂起待回报）
  int64       barrier_parties     = 15; // 条目定型许可数回显
  bool        barrier_settled     = 16; // v5：本条目应用点使一个世代到达终态——Leader 据此对该 key 广播放行
  repeated string barrier_released_keys = 17; // v5：SESSION_CLOSE 打破世代的屏障 key 集（Leader 逐一广播破障）
  // v6：有值引用形态的载荷回执（status=OK 时择用，显式 presence：缺省=null、
  // 零长度=""；标量形态与其余条目恒缺省）。atomic_old_value/atomic_value
  // 标量位对引用形态恒 0。
  optional bytes atomic_old_value_bytes = 18; // 操作前载荷
  optional bytes atomic_value_bytes     = 19; // 操作后（或当前）载荷
  // v7：QUEUE_OP_ENTRY 回执（status=OK/DENIED 时择用；QUEUED 不产生——挂起为
  // Leader 本地裁决，不经应用点）。DENIED 回执 MUST NOT 携带元素/列表。
  // 同槽重放时即重放本组（TAKE 的 queue_element_bytes / DRAIN 的
  // queue_drained_bytes 为重放交付的同一份字节）。
  optional bytes queue_element_bytes = 20; // TAKE 交付 / PEEK 读数（缺省=无元素）
  repeated bytes queue_drained_bytes = 21; // DRAIN 按出队序交付列表
  sint64         queue_size          = 22; // SIZE 读数（驻留口径；其余 op 恒 0）
}

// 快照一致性状态（详设 §7.1；S2 仅定义骨架，生成/加载归 S4）。
// 内容 = 复制状态全集：锁条目 + 会话注册表；等待队列与本地配置不入快照。
// 会话归属节点可由 session_id 高位（nodeId）导出，注册表即会话 id 集合。
// 序列化序即语义序：锁条目按授予先后保持插入序，digest 跨节点可比。
message SnapshotHolder {
  int64 session_id = 1;  // 逻辑会话 id
  int64 thread_id  = 2;
  int32 count      = 3;  // 该 (session, thread) 的持有计数（重入）
}

message SnapshotLock {
  string  key               = 1;
  openlatch.LockType lock_type    = 2;
  int64   lease_token       = 3;
  int64   expires_at_ms     = 4;  // 条目时刻 + 生效租期（EntryClock 确定化语义的产物）
  int64   lease_ms          = 5;  // 实际生效租期（快照重建回灌用）
  repeated SnapshotHolder holders = 6;
  // v3 扩展（编号只增；锁条目保持缺省=字段不出现，序列化字节零扰动）：
  int32 permits_total       = 7;  // SEMAPHORE 条目：许可总量（holders.count 为持有许可数）
  int64 latch_total         = 8;  // LATCH 条目：定型初始计数
  int64 latch_count         = 9;  // LATCH 条目：当前剩余计数
  // v4 扩展（ATOMIC 家族，lock_type ∈ {7,8,9}；其余家族这些字段不出现）：
  int64  atomic_initial        = 10;  // 定型初值（非零主张创建时记录，断言比对基准）
  int64  atomic_value          = 11;  // 当前值
  int64  atomic_version        = 12;  // 版本戳（每次成功写恰 +1）
  int64  atomic_slot_session   = 13;  // 去重槽：最近已应用写操作的逻辑会话（0=无）
  uint64 atomic_slot_op_seq    = 14;  // 去重槽：该写操作 op_seq
  bool   atomic_slot_applied   = 15;  // 去重槽：应答四元组 applied
  int64  atomic_slot_old_value = 16;  // 去重槽：应答 old_value
  int64  atomic_slot_value     = 17;  // 去重槽：应答 value
  int64  atomic_slot_version   = 18;  // 去重槽：应答 version
  // v5 扩展（BARRIER 家族，lock_type = LOCK_TYPE_BARRIER；其余家族不出现）。
  // 到场身份以 (会话, 请求) 表达，列表序即账簿插入序（序列化确定性）。
  int64  barrier_parties             = 19;  // 定型许可数
  int64  barrier_generation          = 20;  // 当前世代号（自 1 起单调递增，恢复不回退）
  repeated SnapshotBarrierArrival barrier_current_arrivals = 21;  // 当前世代到场账簿
  int64  barrier_action_session      = 22;  // 动作挂账会话（0=无挂账）
  int64  barrier_action_request      = 23;  // 动作挂账请求 id
  int64  barrier_completed_generation = 24; // 最近完结世代号（0=尚无）
  int32  barrier_completed_result    = 25;  // 完结形态：1=TRIPPED、2=BROKEN
  repeated SnapshotBarrierArrival barrier_completed_arrivals = 26;  // 完结世代到场账簿
  int64  barrier_completed_executor  = 27;  // 完结世代执行者会话（0=无）
  // v6 扩展（ATOMIC 有值引用形态，lock_type = LOCK_TYPE_ATOMIC_REFERENCE；
  // 其余家族不出现）。值/初值/槽内 old_value/value 为字节串并按显式 presence
  // 口径序列化（缺省=null、零长度=""，两态保真可区分）；版本戳与去重槽骨架
  // 复用标量形态既有字段（atomic_version=12、atomic_slot_session=13、
  // atomic_slot_op_seq=14、atomic_slot_applied=15、atomic_slot_version=18），
  // 引用条目的标量值字段（10/11/16/17）恒缺省。
  optional bytes atomic_ref_initial     = 28; // 定型初值主张（缺省=建条目无主张，初值 null）
  optional bytes atomic_ref_value       = 29; // 当前值（缺省=null）
  optional bytes atomic_ref_slot_old_value = 30; // 去重槽应答 old 载荷（槽空时缺省）
  optional bytes atomic_ref_slot_value     = 31; // 去重槽应答 value 载荷（槽空时缺省）
  // v7 扩展（QUEUE 家族，lock_type ∈ {LOCK_TYPE_QUEUE, LOCK_TYPE_DELAY_QUEUE}；
  // 其余家族不出现）。元素列表序列化序即队列序（跨副本摘要可比的确定性前提）；
  // QUEUE 形态元素到期字段恒缺省（0），DELAY 形态逐毫秒保真；去重槽表每会话
  // 至多一条（客户端同 key 在途写互斥纪律保证），TAKE/DRAIN 槽含已交付字节。
  sint64 queue_capacity = 32;  // 定型容量（建条目非零主张的沉淀值）
  repeated SnapshotQueueElement queue_elements = 33;      // 元素列表（队首在前）
  repeated SnapshotQueueSlot    queue_dedup_slots = 34;   // 每会话去重槽表（会话 id 升序导出）
}

// v7：队列元素（载荷 + 绝对到期时刻）。载荷为不透明字节且非 null——空串元素
// 以零长度表达；expires_at_ms 为应用点折算产物（EntryClock 确定化语义），
// QUEUE 形态恒 0（缺省）。
message SnapshotQueueElement {
  bytes payload        = 1;  // 元素载荷字节（零长度=空串元素）
  int64 expires_at_ms  = 2;  // 绝对到期时刻（0=无到期属性）
}

// v7：队列每会话去重槽（最近一次已应用写操作及其交付回执）。op 取
// 0=PUT / 1=TAKE / 2=DRAIN：PUT 槽无交付字节（重放=OK 已插入）；TAKE 槽
// element_bytes 为已交付元素（含空串元素的零长度形态）；DRAIN 槽 drained_bytes
// 为按出队序的交付列表。SESSION_CLOSE 应用点摘除对应槽。
message SnapshotQueueSlot {
  int64  session_id    = 1;  // 槽主会话
  uint64 op_seq        = 2;  // 槽内写序号（同 op_seq 重放命中本槽）
  int32  op            = 3;  // 了结的写类 op（0=PUT/1=TAKE/2=DRAIN）
  bytes  element_bytes = 4;  // TAKE 交付字节（重放交付同一份）
  repeated bytes drained_bytes = 5; // DRAIN 交付列表（重放交付同一份）
}

// v5：循环屏障到场身份（(会话, 请求) 二元组，快照内列表项）。
message SnapshotBarrierArrival {
  int64 session_id = 1;
  int64 request_id = 2;  // 等待项请求 id（与 session_id 合成到场身份）
}

// next_lease_token 为 S4 增补（发号水位）：快照后新副本的租约凭证发号器从该
// 值起，保证与未截断副本对同一尾部日志发出相同凭证（快照切割点的跨副本一致
// 依赖它，见 s4 design D10）。既有字段 1/2 编号不变。
message SnapshotState {
  repeated SnapshotLock locks    = 1;
  repeated int64        sessions = 2;  // 已登记逻辑会话 id 集合（含归属 nodeId 高位）
  int64 next_lease_token         = 3;  // S4：下一待发号水印（>= max(held lease_token)+1）
}
