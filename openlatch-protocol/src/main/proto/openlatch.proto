syntax = "proto3";

package openlatch;

option java_package = "io.github.lamspace.openlatch.protocol";
option java_multiple_files = true;

// 消息类型：Envelope.type 的取值。
enum MessageType {
  MESSAGE_TYPE_UNKNOWN = 0;
  HELLO          = 1;   // 会话建立（连接后第一条消息）
  LOCK_ACQUIRE   = 2;
  LOCK_RELEASE   = 3;
  LEASE_RENEW    = 4;
  PING           = 5;   // 心跳，无 payload
  AWAIT_NOTIFY   = 6;   // 服务器 → 客户端 推送
  CLUSTER_VIEW   = 7;   // v2：集群视图查询，请求无 payload，任意节点作答
  LATCH_COUNT_DOWN = 8; // v3：屏障倒计数（独立通道，不走 ACQUIRE）
  LATCH_AWAIT      = 9; // v3：屏障等待（QUEUED/AWAIT_NOTIFY 复用）
  ADMIN_SUMMARY       = 10; // v3：管理摘要（只读观察，需管理令牌）
  ADMIN_LIST_KEYS     = 11; // v3：key 列表（分页/前缀过滤，只读）
  ADMIN_KEY_DETAIL    = 12; // v3：单 key 明细（持有者/等待队列/租约）
  ADMIN_LIST_SESSIONS = 13; // v3：本节点接入会话列表
}

// 锁类型。
enum LockType {
  LOCK_TYPE_REENTRANT = 0;   // 默认：可重入互斥
  LOCK_TYPE_SIMPLE    = 1;   // 不可重入互斥
  LOCK_TYPE_READ      = 2;
  LOCK_TYPE_WRITE     = 3;
  LOCK_TYPE_FAIR      = 4;   // v3：显式公平承诺互斥（语义等价 REENTRANT，仅对 v3 会话开放）
  LOCK_TYPE_SEMAPHORE = 5;   // v3：许可门闸（仅对 v3 会话开放，详设 §2.3）
  LOCK_TYPE_LATCH     = 6;   // v3：倒计数屏障定型判别（屏障操作经 LATCH_* 消息，详设 §2.4）
}

// 状态码。
enum StatusCode {
  OK              = 0;
  QUEUED          = 1;   // 已登记到等待队列
  DENIED          = 2;   // 未排队直接拒绝（立即式 tryLock 且锁被占）
  INVALID_TOKEN   = 3;   // leaseToken 不匹配（误释放/误续租）
  NOT_HELD        = 4;   // 该会话未持有该锁
  SESSION_EXPIRED = 5;   // 会话不存在（重连后的旧请求）
  OVERLOADED      = 6;   // 触发服务端保护限额
  KEY_TOO_LONG    = 7;
  KEY_EMPTY       = 8;
  INVALID_REQUEST = 9;   // 参数非法（如 lease 越界）
  NOT_LEADER      = 10;  // v2 启用（Phase 1 预留）：本节点非当值 Leader 拒绝写请求，随附 leader 提示
  INTERNAL_ERROR  = 11;
}

// 统一封装。request_id 在单条连接内唯一；服务端推送（AWAIT_NOTIFY）时为 0。
message Envelope {
  int32       protocol_version = 1;   // v1 固定为 1；v2 起客户端请求填 1 或 2，服务端应答回显请求版本
  MessageType type               = 2;
  int64       request_id         = 3; // 服务端推送（AWAIT_NOTIFY）时为 0
  oneof payload {
    HelloRequest        hello_request        = 10;
    HelloResponse       hello_response       = 11;
    AcquireRequest      acquire_request      = 12;
    AcquireResponse     acquire_response     = 13;
    ReleaseRequest      release_request      = 14;
    ReleaseResponse     release_response     = 15;
    LeaseRenewRequest   lease_renew_request  = 16;
    LeaseRenewResponse  lease_renew_response = 17;
    AwaitNotify         await_notify         = 18;
    ClusterView         cluster_view         = 19;  // v2：CLUSTER_VIEW 的响应载荷（请求无 payload）
    LatchCountDownRequest  latch_count_down_request  = 20;  // v3
    LatchCountDownResponse latch_count_down_response = 21;  // v3
    LatchAwaitRequest      latch_await_request       = 22;  // v3
    LatchAwaitResponse     latch_await_response      = 23;  // v3
    AdminSummaryRequest       admin_summary_request       = 24;  // v3：ADMIN 四组（详设 §4.2，只读观察）
    AdminSummaryResponse      admin_summary_response      = 25;
    AdminListKeysRequest      admin_list_keys_request     = 26;
    AdminListKeysResponse     admin_list_keys_response    = 27;
    AdminKeyDetailRequest     admin_key_detail_request    = 28;
    AdminKeyDetailResponse    admin_key_detail_response   = 29;
    AdminListSessionsRequest  admin_list_sessions_request  = 30;
    AdminListSessionsResponse admin_list_sessions_response = 31;
  }
}

message HelloRequest {
  int32  client_protocol_version = 1;
  string client_name             = 2;  // 诊断用（应用名/主机），可为空
  string auth_token              = 3;  // Phase 3 预留，Phase 1 必须为空
}

message HelloResponse {
  StatusCode status                  = 1;
  int64      session_id              = 2;  // 服务端分配，连接生命周期内有效
  int32      server_protocol_version = 3;
  int64      default_lease_ms        = 4;
  int64      leader_hint             = 5;  // v2 启用（Phase 1 预留）：Leader 的 nodeId；集群模式必填——
                                           // >0 为 Leader nodeId，-1 表示本节点暂不知晓 Leader 身份；单机模式不填（0）
  string     leader_address          = 6;  // v2：Leader 接入地址（host:port）；未配置地址映射时为空串
}

message AcquireRequest {
  string   key           = 1;
  LockType lock_type     = 2;
  int64    thread_id     = 3;   // 客户端提供；与 session_id 共同构成锁归属
  int64    lease_ms      = 4;   // 0 = 用服务端默认值；越界返回 INVALID_REQUEST
  int64    wait_ms       = 5;   // -1 = 排队；0 = 立即式；>0 由客户端本地计时，语义等价于 -1
  int32    permits       = 6;   // v3：请求许可数，仅 SEMAPHORE 有效；0 按 1 处理，非 SEMAPHORE 携带 >1 拒绝
  int32    permits_total = 7;   // v3：许可总量断言，仅 SEMAPHORE 有效；建条目必填 >0，既有条目非零须匹配，0=不主张
}

message AcquireResponse {
  StatusCode status              = 1;  // OK=授予 / QUEUED=排队 / DENIED=拒绝 / NOT_LEADER(v2)=改道 / 错误码
  int64      lease_token         = 2;  // OK 时有效：解锁与续租凭证
  int64      lease_expires_at_ms = 3;  // 服务端时钟，仅诊断参考
  int32      queue_position      = 4;  // QUEUED 时有效
  int64      granted_lease_ms    = 5;  // OK 时实际生效租约（客户端据此设定看门狗）
  int64      leader_node_id      = 6;  // v2：仅 NOT_LEADER 时随附；Leader nodeId，-1=本节点暂不知晓 Leader
  string     leader_address      = 7;  // v2：仅 NOT_LEADER 时随附；Leader 接入地址，未配置映射时为空串
}

message ReleaseRequest {
  string key         = 1;
  int64  lease_token = 2;
  int64  thread_id   = 3;
  int32  permits     = 4;   // v3：归还许可数，仅 Semaphore 条目消费；0 按 1 处理；负值拒绝
}

message ReleaseResponse {
  // 转发道码形（v2）：INVALID_TOKEN/NOT_HELD 仅产生于条目经多数派提交后的应用点
  // 归属裁决（权威判定；收到即"该会话确未持有该锁"的事实，非改道信号）；
  // 转发够不到当值 Leader 恒回 NOT_LEADER（可重试码，随附提示，MUST NOT 读作锁已丢）。
  StatusCode status          = 1;  // OK / INVALID_TOKEN / NOT_HELD / NOT_LEADER(v2，仅转发失败路径)
  bool       fully_released  = 2;  // 可重入计数归零时为 true
  int64      leader_node_id  = 3;  // v2：仅 NOT_LEADER 时随附；Leader nodeId，-1=本节点暂不知晓 Leader
  string     leader_address  = 4;  // v2：仅 NOT_LEADER 时随附；Leader 接入地址，未配置映射时为空串
}

message LeaseRenewRequest {
  string key         = 1;
  int64  lease_token = 2;
  int64  lease_ms    = 3;   // 请求续到的时长（通常等于原租约）
}

message LeaseRenewResponse {
  // 转发道码形（v2）：同 ReleaseResponse——INVALID_TOKEN/NOT_HELD 仅出自多数派
  // 提交后的应用点权威裁决；转发失败恒 NOT_LEADER（可重试，非锁失效判定）。
  StatusCode status              = 1;  // OK / INVALID_TOKEN / NOT_HELD / NOT_LEADER(v2，仅转发失败路径)
  int64      lease_expires_at_ms = 2;
  int64      leader_node_id      = 3;  // v2：仅 NOT_LEADER 时随附；Leader nodeId，-1=本节点暂不知晓 Leader
  string     leader_address      = 4;  // v2：仅 NOT_LEADER 时随附；Leader 接入地址，未配置映射时为空串
}

message AwaitNotify {
  string key            = 1;
  int64  request_id_ref = 2;  // 指向原 ACQUIRE 的 request_id
}

// v3：屏障倒计数（Phase 3 详设 §2.1/design D1 精化）。count 为本次扣减量；
// total 为初始计数定型断言：非零且屏障不存在则创建（count=0 即纯初始化）、
// 存在则须匹配；零为不主张（不存在即 INVALID_REQUEST）。归零后 await 即过、
// countDown 无操作（一次性）。
message LatchCountDownRequest {
  string key   = 1;
  int64  count = 2;   // 本次扣减量（>= 0）
  int64  total = 3;   // 定型断言（>= 0，0 为不主张）
}

message LatchCountDownResponse {
  StatusCode status    = 1;  // OK=已生效（含归零后无操作）/ 错误码
  int64      remaining = 2;  // OK 时的剩余计数
}

// v3：屏障等待。计数未归零 → QUEUED（复用 AWAIT_NOTIFY 通知后同 request_id
// 重发，幂等）；已归零 → OK 立即通过。total 断言同上；等待者无租约。
message LatchAwaitRequest {
  string key   = 1;
  int64  total = 2;   // 定型断言（>= 0，0 为纯加入）
}

message LatchAwaitResponse {
  StatusCode status         = 1;  // OK=已归零放行 / QUEUED=挂起等待 / 错误码
  int32      queue_position = 2;  // QUEUED 时有效（1 起）
}

// v2：CLUSTER_VIEW 响应——任意节点依本地视图作答（成员表 + Leader 标记），不产生日志条目。
// status 自述结果：OK=正常；INVALID_REQUEST=单机模式无视图可报（v2 未发布前的补充，
// 保证拒绝路径的状态码在线路可见，对齐 Phase 1 "无 payload 类型以无体帧呈现"的例外）。
message ClusterView {
  repeated NodeInfo nodes = 1;
  StatusCode status       = 2;  // 应答结果（成功 OK + 成员表；失败错误码 + 空表）
}

// v2：集群成员视图项。address 为该节点接入地址（host:port），未配置地址映射时为空串。
message NodeInfo {
  int64  node_id   = 1;
  string address   = 2;
  bool   is_leader = 3;
}

// ===== v3：管理观察消息（Phase 3 详设 §4.2 / T3 P3-11） =====
// 只读观察面：服务端以受理节点本地状态作答，MUST NOT 产生复制日志条目；
// 每条请求携带管理令牌（admin-token），校验失败统一 INVALID_REQUEST 并断连
// （实施勘误：令牌逐消息承载，不经 HELLO auth_token——见 change phase3-t3 design D1）。
// family 取条目家族名（lock/semaphore/latch，与指标 type 标签同一词表）；
// node_role 取 SINGLE/LEADER/FOLLOWER/UNKNOWN（选举空窗如实未知）。

message AdminSummaryRequest {
  string token = 1;   // 管理令牌
}

message AdminSummaryResponse {
  StatusCode status           = 1;
  int32      held_locks       = 2;  // 锁家族持有中条目数
  int32      held_semaphores  = 3;  // Semaphore 家族持有中条目数
  int32      latch_entries    = 4;  // Latch 条目数（无持有语义，单列）
  int32      total_waiters    = 5;  // 等待者总数（本节点视角；非 Leader 恒 0）
  int32      session_count    = 6;  // 本节点活跃会话数
  string     node_role        = 7;  // SINGLE/LEADER/FOLLOWER/UNKNOWN
  int64      uptime_ms        = 8;  // 自启动运行时长（应答时刻）
  string     version          = 9;  // 服务端版本
}

message AdminListKeysRequest {
  string token     = 1;   // 管理令牌
  int32  page      = 2;   // 页号（0 起）
  int32  page_size = 3;   // 页大小（1..服务端上限，越界 INVALID_REQUEST）
  string prefix    = 4;   // key 前缀过滤；空串不过滤
}

// ADMIN_LIST_KEYS 列表行。holders 为持有者计数（明细见 ADMIN_KEY_DETAIL）。
message AdminKeyInfo {
  string key                 = 1;
  string family              = 2;  // lock/semaphore/latch
  int32  holders             = 3;  // 持有者数（Latch 恒 0）
  int64  remaining_lease_ms  = 4;  // 剩余租约（受理节点时钟；未持有为 0）
  int32  waiter_count        = 5;  // 等待者数（非 Leader 视角恒 0）
}

message AdminListKeysResponse {
  StatusCode status        = 1;
  int32      total_matched = 2;  // 过滤后总条数（弱一致快照）
  int32      page          = 3;
  int32      page_size     = 4;
  repeated   AdminKeyInfo  items = 5;
}

message AdminKeyDetailRequest {
  string token = 1;   // 管理令牌
  string key   = 2;
}

// 持有明细项。role 取 writer/reader/holder（Semaphore 归属统一 holder）。
message AdminKeyHolderInfo {
  int64  session_id = 1;
  int64  thread_id  = 2;
  int32  count      = 3;  // 重入层数或持有许可数
  string role       = 4;
}

// 等待队列项（仅 Leader 应答非空）。notified=已通知待重发；latch 等待者
// thread_id 恒 0（await 无归属线程概念，身份=(会话,请求)）。
message AdminKeyWaiterInfo {
  int32  position    = 1;  // 1 起位次
  int64  session_id  = 2;
  int64  request_id  = 3;
  int64  waited_ms   = 4;
  int32  permits     = 5;  // 请求许可数（锁/屏障恒 1）
  bool   notified    = 6;
}

message AdminKeyDetailResponse {
  StatusCode status = 1;  // OK=命中；NOT_HELD=key 无条目（明确未命中，非错误）
  string family     = 2;
  repeated AdminKeyHolderInfo holders = 3;
  repeated AdminKeyWaiterInfo waiters = 4;
  int64  lease_expires_at_ms  = 5;   // 0=无租约（Latch 或无持有）
  int64  remaining_lease_ms   = 6;   // 受理节点时钟口径；无租约为 0
  int32  permits_total        = 7;   // SEMAPHORE 专属，其余 0
  int32  permits_available    = 8;   // SEMAPHORE 专属，其余 0
  int64  latch_total          = 9;   // LATCH 专属，其余 0
  int64  latch_remaining      = 10;  // LATCH 专属，其余 0（-1 恒不出现：未命中走 status）
  bool   wait_queue_leader_only = 11; // true=本节点非 Leader，等待队列区无数据
}

// 本节点接入会话项。node_id 由 sessionId 高位导出（恒为受理节点自身）。
message AdminSessionInfo {
  int64 session_id      = 1;
  int64 node_id         = 2;
  int64 connected_at_ms = 3;  // 建连时刻（受理节点时钟）
  int32 held_keys       = 4;  // 持有中的 key 数
  int32 waiting_keys    = 5;  // 在队等待数（本节点队列视角）
}

message AdminListSessionsRequest {
  string token = 1;   // 管理令牌
}

message AdminListSessionsResponse {
  StatusCode status = 1;
  repeated AdminSessionInfo sessions = 2;
}
